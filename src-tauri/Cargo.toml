[package]
name = "firescene-gcs"
version = "0.1.0"
description = "FireScene ground control station"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mavlink = { version = "0.21.0", default-features = false, features = ["std", "dialect-common"] }
serialport = "4.10.1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
