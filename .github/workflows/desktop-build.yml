name: Manual desktop builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo install tauri-cli --version 2.12.6 --locked
      - run: cargo tauri build --bundles deb -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: firescene-ubuntu-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo install tauri-cli --version 2.12.6 --locked
      - run: cargo tauri build --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: firescene-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
